name: Build S789 Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing signing secrets"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare official manager native libs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          apk_asset = next(
              asset for asset in release["assets"]
              if asset["name"].endswith("-release.apk")
          )

          with open("official-manager.apk", "wb") as fp:
              download_request = urllib.request.Request(
                  apk_asset["browser_download_url"],
                  headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"},
              )
              with urllib.request.urlopen(download_request) as response:
                  fp.write(response.read())
          PY
          mkdir -p manager/app/src/main/jniLibs
          unzip -q official-manager.apk 'lib/*' -d extracted-libs
          cp -R extracted-libs/lib/. manager/app/src/main/jniLibs/

      - name: Configure signing
        working-directory: manager
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          cat >> gradle.properties <<EOF
          KEYSTORE_FILE=key.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build final manager
        working-directory: manager
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          apk_path=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Extract signing info
        id: sign
        run: |
          python3 scripts/extract_apk_signature.py \
            "${{ steps.apk.outputs.apk_path }}" \
            --label final \
            --package com.s789.sk \
            --output final-signature.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Write final kernel config
        run: |
          cat > final-kernel-config.txt <<EOF
          Package: com.s789.sk
          Certificate size: ${{ steps.sign.outputs.cert_size }}
          Certificate SHA256: ${{ steps.sign.outputs.cert_hash }}

          Dynamic Manager:
          su -c "echo '${{ steps.sign.outputs.cert_size }}:${{ steps.sign.outputs.cert_hash }}' > /data/adb/ksu/dynamic_manager"

          Kernel Kbuild overrides:
          KSU_EXPECTED_SIZE=${{ steps.sign.outputs.cert_size }}
          KSU_EXPECTED_HASH=${{ steps.sign.outputs.cert_hash }}
          KSU_MANAGER_PACKAGE=com.s789.sk
          EOF

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S789-Final
          path: |
            ${{ steps.apk.outputs.apk_path }}
            final-signature.txt
            final-kernel-config.txt
