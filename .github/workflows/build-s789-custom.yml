name: Build S789 Compatible

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing signing secrets"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure signing
        working-directory: manager
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          cat >> gradle.properties <<EOF
          KEYSTORE_FILE=key.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build compatible manager
        working-directory: manager
        env:
          MANAGER_APPLICATION_ID: com.sukisu.ultra
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          apk_path=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Extract signing info
        id: sign
        run: |
          python3 scripts/extract_apk_signature.py \
            "${{ steps.apk.outputs.apk_path }}" \
            --label compatible \
            --package com.sukisu.ultra \
            --output compatible-signature.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Write compatibility notes
        run: |
          cat > compatible-notes.txt <<EOF
          Source package override: com.sukisu.ultra
          Purpose: keep kernel package compatibility while testing the new UI and hidden-module feature.
          Certificate size: ${{ steps.sign.outputs.cert_size }}
          Certificate SHA256: ${{ steps.sign.outputs.cert_hash }}
          Dynamic Manager:
          su -c "echo '${{ steps.sign.outputs.cert_size }}:${{ steps.sign.outputs.cert_hash }}' > /data/adb/ksu/dynamic_manager"
          EOF

      - name: Upload compatible artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S789-Compatible
          path: |
            ${{ steps.apk.outputs.apk_path }}
            compatible-signature.txt
            compatible-notes.txt
