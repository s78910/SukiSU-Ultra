name: Build S789 Baseline

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream ref to build
        required: false
        default: main
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo tools
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: ${{ inputs.upstream_ref }}
          path: upstream
          fetch-depth: 0

      - name: Require signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing signing secrets"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure signing
        working-directory: upstream/manager
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          cat >> gradle.properties <<EOF
          KEYSTORE_FILE=key.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build upstream manager
        working-directory: upstream/manager
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          apk_path=$(find upstream/manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Extract signing info
        id: sign
        run: |
          python3 repo/scripts/extract_apk_signature.py \
            "${{ steps.apk.outputs.apk_path }}" \
            --label baseline \
            --package com.sukisu.ultra \
            --output baseline-signature.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S789-Baseline-${{ inputs.upstream_ref }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            baseline-signature.txt
